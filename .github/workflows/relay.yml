# Перезаливка ретранслятора в облако.
#
# Сайт обновляется сам: GitHub Pages раздаёт ветку main напрямую, и после каждого слияния
# новая версия у всех. А ретранслятор живёт отдельно, в Cloudflare, и туда файлы попадают
# только командой `wrangler deploy` с чьего-то компьютера.
#
# Из-за этой разницы они расходятся молча. Игра на сайте уже новая, ретранслятор ещё
# старый — и онлайн не работает целиком: комната сверяет номер протокола при входе и с
# чужим не пускает. По экрану этого не понять, «Play» просто никогда не загорается. На
# этом мы один раз уже наступили.
#
# Поэтому ретранслятор заливается тем же движением, что и сайт: слили в main — уехало.

name: Ретранслятор

on:
  push:
    branches: [main]
    # Только когда менялся он сам. Правки игры сюда не относятся: их разносит Pages, а
    # лишняя перезаливка ретранслятора рвала бы живым игрокам соединение.
    paths:
      - 'worker/**'
      - '.github/workflows/relay.yml'
  # Кнопка «запустить вручную» на вкладке Actions: пригодится, если залить надо, а
  # менять в папке нечего.
  workflow_dispatch:

# Две заливки разом — это гонка за то, чья версия останется. Очередь, а не отмена:
# отменённая заливка означала бы, что уехало не то, что в main.
concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Весь набор, а не только онлайновые проверки. Среди них есть ровно та, что сверяет
      # номер протокола у игры и у комнаты, — и это последнее место, где рассинхрон можно
      # поймать до того, как он уедет игрокам. Девять секунд.
      - name: Проверки
        run: |
          for f in scripts/smoke-*.js; do
            node "$f" > /dev/null || { echo "::error::упал $f"; exit 1; }
          done
          echo "проверок пройдено: $(ls scripts/smoke-*.js | wc -l)"

      - name: Залить
        working-directory: worker
        run: npx --yes wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
